name: Pinterest daily automation

on:
  schedule:
    # Starts at 09:25 BRT so setup finishes before the script publishes at 09:30, 09:31, 09:32, 09:33 and 09:34.
    - cron: "25 12 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Pins to publish"
        required: false
        default: "5"
      dry_run:
        description: "Dry run only"
        required: false
        default: "false"
      date:
        description: "Brazil date to publish, YYYY-MM-DD. Leave empty for today."
        required: false
        default: ""
      regenerate_assets:
        description: "Regenerate pin batch/assets before publishing"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: pinterest-daily-production
  cancel-in-progress: false

jobs:
  pinterest:
    if: github.event_name != 'schedule' || github.event.schedule == '25 12 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: pinterest_automation
    env:
      PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
      PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
      PINTEREST_REDIRECT_URI: ${{ secrets.PINTEREST_REDIRECT_URI }}
      PINTEREST_TOKEN_JSON: ${{ secrets.PINTEREST_TOKEN_JSON }}
      PIN_IMAGE_BASE_URL: ${{ vars.PIN_IMAGE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pinterest_automation/package-lock.json

      - run: npm ci

      - name: Restore Pinterest token
        run: |
          mkdir -p secrets
          printf '%s' "$PINTEREST_TOKEN_JSON" > secrets/pinterest_token.json

      - name: Generate pins and images
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.regenerate_assets == 'true'
        run: |
          LIMIT="${{ github.event.inputs.limit || '5' }}"
          node scripts/generate_pin_batch.mjs
          node scripts/apply_image_assets.mjs
          node scripts/render_pin_images.mjs --limit "$LIMIT"
          node scripts/export_image_prompts.mjs

      - name: Commit generated images before publishing
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.regenerate_assets == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: generate daily pinterest assets"
          file_pattern: "pinterest_automation/public/pinterest/** pinterest_automation/output/*.json pinterest_automation/output/*.csv"

      - name: Refresh publish history
        run: git pull --ff-only origin main

      - name: Acquire daily publish lock
        if: github.event_name == 'schedule'
        run: |
          DATE_KEY=$(node -e "console.log(new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()))")
          LOCK_FILE="output/daily_locks/${DATE_KEY}.lock"
          mkdir -p output/daily_locks
          git pull --ff-only origin main
          if [ -f "$LOCK_FILE" ]; then
            echo "Pinterest daily run for ${DATE_KEY} already has a lock. Skipping publish."
            echo "PINTEREST_SKIP_PUBLISH=true" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '{"date":"%s","run_id":"%s","created_at":"%s"}\n' "$DATE_KEY" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$LOCK_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOCK_FILE"
          git commit -m "chore: lock pinterest run ${DATE_KEY}"
          if ! git push origin HEAD:main; then
            echo "Another Pinterest run acquired the lock for ${DATE_KEY}. Skipping publish."
            echo "PINTEREST_SKIP_PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - name: Validate vertical Pinterest images
        if: env.PINTEREST_SKIP_PUBLISH != 'true'
        run: |
          DATE_INPUT="${{ github.event.inputs.date || '' }}"
          DATE_ARG=()
          if [ -n "$DATE_INPUT" ]; then
            DATE_ARG=(--date "$DATE_INPUT")
          fi
          node scripts/validate_pin_images.mjs "${DATE_ARG[@]}"

      - name: Publish daily pins
        if: env.PINTEREST_SKIP_PUBLISH != 'true'
        run: |
          LIMIT="${{ github.event.inputs.limit || '5' }}"
          DATE_INPUT="${{ github.event.inputs.date || '' }}"
          DATE_ARG=()
          if [ -n "$DATE_INPUT" ]; then
            DATE_ARG=(--date "$DATE_INPUT")
          fi
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            node scripts/publish_pins.mjs --dry-run --limit "$LIMIT" "${DATE_ARG[@]}"
          else
            node scripts/publish_pins.mjs --limit "$LIMIT" --start-at 09:30 --interval 60 "${DATE_ARG[@]}"
          fi

      - name: Commit publish history
        if: always() && env.PINTEREST_SKIP_PUBLISH != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update pinterest publish history"
          file_pattern: "pinterest_automation/output/*.json"
